server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Old single-segment .html URLs redirect to the clean URL, for example
    # /about-1.html -> /about-1/. This MUST stay a regex location, not a
    # server-level rewrite, and it MUST exclude index.html. A server-level
    # .html rewrite breaks directory index handling on static sites.
    location ~ ^/(?!index\.html)([^/]+)\.html$ {
        return 301 /$1/;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
